<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada | Vettor Delta</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#23162A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="assets/icone.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="manifest" href="assets/site.webmanifest">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #23162A;
            background: linear-gradient(135deg, #23162A 0%, #524B6A 50%, #874F68 100%);
            color: #E7C59F;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: -30%;
            right: -15%;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(135, 79, 104, 0.4) 0%, transparent 70%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -20%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(82, 75, 106, 0.5) 0%, transparent 70%);
            pointer-events: none;
        }

        .container {
            max-width: 500px;
            position: relative;
            z-index: 2;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 2rem;
            display: block;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 5.5rem;
            font-weight: 900;
            color: #ECFE30;
            margin-bottom: 1rem;
            line-height: 1;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 24px rgba(236, 254, 48, 0.3);
        }

        h2 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #E7C59F;
            letter-spacing: -0.01em;
        }

        p {
            font-size: 1.1rem;
            color: #C9B89A;
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            background: #ECFE30;
            color: #23162A;
            text-decoration: none;
            border-radius: 50px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.05rem;
            letter-spacing: 0.02em;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 24px rgba(236, 254, 48, 0.3);
        }

        .btn:hover {
            background: #ECFE30;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(236, 254, 48, 0.5);
        }

        .btn:focus-visible {
            outline: 2px solid #ECFE30;
            outline-offset: 4px;
        }

        .brand {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #9D8FAE;
            margin-top: 3rem;
        }

        .brand span {
            color: #ECFE30;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 4rem;
            }

            h2 {
                font-size: 1.25rem;
            }

            p {
                font-size: 1rem;
            }

            .btn {
                width: 100%;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .btn {
                transition: none;
            }

            .btn:hover {
                transform: none;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="assets/logo_rapha_vetor.af_1_.png" alt="Logo Vettor Delta" class="logo" width="90" height="90">
        <h1>404</h1>
        <h2>Página não encontrada</h2>
        <p>A página que você procura não existe ou foi movida. Mas não se preocupe — a jornada continua.</p>
        <a href="/" class="btn">Voltar para o início</a>
        <p class="brand">Vettor<span>Delta</span></p>
    </div>
</body>

</html>
